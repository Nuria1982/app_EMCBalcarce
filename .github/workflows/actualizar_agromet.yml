name: Actualizar datos y publicar Agromet

# Todos los días baja de Dropbox el Excel de la EMC Balcarce, lo controla,
# lo guarda en el repo y, si cambió, vuelve a publicar la app en shinyapps.io.
#
# Secrets necesarios (Settings > Secrets and variables > Actions):
#   DROPBOX_URL        link compartido del balcarce_EMC.xlsx en Dropbox
#   SHINYAPPS_ACCOUNT  intabalcarce
#   SHINYAPPS_TOKEN    token de shinyapps.io (Account > Tokens)
#   SHINYAPPS_SECRET   secret de ese token
#   METEORED_API_KEY   clave de Meteored

on:
  schedule:
    - cron: "17 11 * * *"   # todos los días 8:17 hora Argentina
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-agromet
  cancel-in-progress: false

env:
  # El .Rprofile activa renv; en GitHub se usan los paquetes instalados abajo.
  RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependencias
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rsconnect
            any::shiny
            any::shinyWidgets
            any::shinydashboard
            any::shinycssloaders
            any::DT
            any::tidyr
            any::ggplot2
            any::plotly
            any::dplyr
            any::bslib
            any::shinythemes
            any::bs4Dash
            any::lubridate
            any::png
            any::readxl
            any::writexl
            any::openxlsx
            any::leaflet
            any::sf
            any::webshot
            any::httr
            any::jsonlite
            any::broom
            any::purrr
            any::minpack.lm
            any::httr2
            any::usethis
            any::zoo
            any::stringr
            any::readr
            any::patchwork
            any::cowplot
            any::remotes
            any::PKI
            any::cpp11
            any::fansi
            any::prettyunits
            any::progress
            github::AgRoMeteorologiaINTA/siga

      - name: Actualizar Excel desde Dropbox
        env:
          DROPBOX_URL: ${{ secrets.DROPBOX_URL }}
        run: Rscript scripts/actualizar_desde_dropbox.R

      - name: Detectar cambios
        id: cambios
        shell: bash
        run: |
          if git diff --quiet -- balcarce_EMC.xlsx; then
            echo "actualizado=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en el Excel"
          else
            echo "actualizado=true" >> "$GITHUB_OUTPUT"
            echo "Excel actualizado"
          fi

      - name: Guardar cambios en GitHub
        if: steps.cambios.outputs.actualizado == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add balcarce_EMC.xlsx
          git commit -m "Datos EMC Balcarce desde Dropbox ($(date +%F))"
          git push

      # Se publica si cambiaron los datos o si se corrió a mano
      - name: Preparar configuración privada de Meteored
        if: steps.cambios.outputs.actualizado == 'true' || github.event_name == 'workflow_dispatch'
        env:
          METEORED_API_KEY: ${{ secrets.METEORED_API_KEY }}
        shell: bash
        run: |
          test -n "$METEORED_API_KEY"
          printf 'options(METEORED_API_KEY = Sys.getenv("METEORED_API_KEY"))\n' > config.R

      - name: Publicar Agromet en shinyapps.io
        if: steps.cambios.outputs.actualizado == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          METEORED_API_KEY: ${{ secrets.METEORED_API_KEY }}
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name = Sys.getenv("SHINYAPPS_ACCOUNT"),
              token = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )

            # Usar los paquetes instalados en GitHub Actions
            # sin depender del archivo renv.lock.
            rsconnect::deployApp(
              appDir = ".",
              appName = "Agromet",
              account = Sys.getenv("SHINYAPPS_ACCOUNT"),
              server = "shinyapps.io",
              renv = FALSE,
              forceUpdate = TRUE,
              launch.browser = FALSE
            )
          '
