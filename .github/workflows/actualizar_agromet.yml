
name: Actualizar SIGA y publicar Agromet

on:
  schedule:
    # 09:00 Argentina (UTC-3)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-agromet
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libharfbuzz-dev \
            libfribidi-dev

      
      - name: Instalar paquetes R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rsconnect
            any::shiny
            any::shinyWidgets
            any::shinydashboard
            any::shinycssloaders
            any::DT
            any::tidyr
            any::ggplot2
            any::plotly
            any::dplyr
            any::bslib
            any::shinythemes
            any::bs4Dash
            any::lubridate
            any::png
            any::readxl
            any::writexl
            any::openxlsx
            any::leaflet
            any::sf
            any::webshot
            any::httr
            any::jsonlite
            any::broom
            any::purrr
            any::minpack.lm
            any::httr2
            any::usethis
            any::zoo
            any::stringr
            any::readr
            any::patchwork
            any::cowplot
            any::remotes
            github::AgRoMeteorologiaINTA/siga


      - name: Actualizar Excel desde SIGA
        run: Rscript scripts/actualizar_datos.R

      - name: Detectar cambios del Excel
        id: cambios
        shell: bash
        run: |
          if git diff --quiet -- balcarce_EMC.xlsx; then
            echo "actualizado=false" >> "$GITHUB_OUTPUT"
            echo "No hay cambios en el Excel."
          else
            echo "actualizado=true" >> "$GITHUB_OUTPUT"
            echo "Hay datos nuevos para publicar."
          fi

      - name: Guardar Excel actualizado en GitHub
        if: steps.cambios.outputs.actualizado == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add balcarce_EMC.xlsx
          git commit -m "Actualización automática SIGA Balcarce"
          git push origin HEAD:main

      - name: Publicar Agromet en shinyapps.io
        if: steps.cambios.outputs.actualizado == 'true'
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name = Sys.getenv("SHINYAPPS_ACCOUNT"),
              token = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )

            rsconnect::deployApp(
              appDir = ".",
              appName = "Agromet",
              account = Sys.getenv("SHINYAPPS_ACCOUNT"),
              server = "shinyapps.io",
              appFiles = c(
                "app.R",
                "balcarce_EMC.xlsx"
              ),
              launch.browser = FALSE
            )
          '
